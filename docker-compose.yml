services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env.docker
    environment:
      UPLOAD_ROOT: /data/uploads
    volumes:
      - backend_uploads:/data/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8001}
    environment:
      # Next's standalone server.js reads HOSTNAME, and Docker sets it to the container
      # id — so without this it binds to that name instead of every interface.
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
